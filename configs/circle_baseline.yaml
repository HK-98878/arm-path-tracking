# Step 1: Circle Baseline Configuration
# Position tracking only, no CAPS, no velocity matching

# Environment
env:
  model_path: "src/models/mujoco_menagerie/franka_emika_panda/panda_nohand.xml"
  dt: 0.01  # 100 Hz control
  max_episode_steps: 1000
  ee_body_name: "attachment"  # End-effector attachment point

# Path
path:
  type: circle
  radius: 0.15  # meters
  center: [0.32, 0.0, 0.52]  # [x, y, z] - centered so EE starts ON the circle
  speed: 0.1  # m/s

# Control
control:
  # Design doc recommends 0.02 for linear - keeps residual ~10x feedforward (not 43x)
  action_scale: [0.02, 0.02, 0.02, 0.05, 0.05, 0.05]  # [lin_x, lin_y, lin_z, ang_x, ang_y, ang_z]
  dls:
    k_limit: 0.5
    lambda_min: 0.0001
    lambda_max: 0.1
    manip_threshold: 0.05

# Reward (Step 3: position + tangent progress)
reward:
  w_pos: 1.0
  w_ori: 0.0  # Disabled for Step 1
  # Tangent progress: rewards velocity component along path direction
  # Uses tanh(progress) where progress = (ee_vel · tangent_dir) / target_speed
  # - progress=1.0 (keeping up): r_vel ≈ 0.76 * w_vel
  # - progress>1.0 (catching up): higher reward, no penalty for going fast
  # - progress<0 (going backwards): negative reward
  # GATED by position error - fades to 0 beyond vel_gate_max to focus on correction
  w_vel: 0.5
  w_action_rate: 0.1    # Adaptive penalty - scaled by pos_quality (low when off-path)
  w_joint_vel: 0.001   # Adaptive penalty - scaled by pos_quality
  # sig_pos=0.15 gives strong gradient at small errors:
  #   at 50mm: 0.89, at 100mm: 0.64, at 150mm: 0.37
  sig_pos: 0.15
  sig_ori: 0.1   # Not used yet
  sig_vel: 0.15  # Not used for tangent progress (normalized by target_speed instead)
  # Linear fallback for position reward - ensures gradient exists at large errors
  # Beyond this distance, exponential reward is near-zero, linear provides recovery signal
  pos_linear_fallback_max: 0.5  # 500mm
  # Gate for velocity reward - beyond this, focus purely on position correction
  vel_gate_max: 0.15  # 150mm - moderate gating
  # Velocity reward type:
  #   "tangent" - reward velocity along path tangent (can encourage shortcuts)
  #   "arc_length" - reward arc-length progress ds/dt (rewards keeping up, not shortcuts)
  vel_reward_type: arc_length

# PPO
ppo:
  learning_rate: 0.00003  # Initial LR
  lr_min: 0.000005        # Minimum LR (floor for decay)
  lr_decay: linear        # Decay type: linear decay over training
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  n_steps: 2048
  n_epochs: 4    # Reduced from 10 - fewer passes over same data
  batch_size: 64
  ent_coef: 0.01          # Initial entropy coefficient
  ent_coef_min: 0.001     # Minimum entropy (floor for annealing)
  ent_decay: linear       # Decay type: linear annealing over training
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden_sizes: [256, 256]

# CAPS - smoothness in policy loss (more principled than reward penalties)
caps:
  enabled: true
  lambda_temporal: 0.5   # Penalize action changes between timesteps (5x increase)
  lambda_spatial: 0.1    # Penalize sensitivity to observation noise (10x increase)
  spatial_noise_std: 0.01

# Training
training:
  total_timesteps: 1000000  # 1M steps
  eval_frequency: 10000     # Evaluate every 10k steps
  save_frequency: 50000     # Save checkpoint every 50k steps
  log_frequency: 1000       # Log metrics every 1k steps
  num_eval_episodes: 5      # Episodes for evaluation
  normalization_warmup: 10000  # Freeze obs/reward normalization after this many steps

# Logging
logging:
  output_dir: "outputs/circle_baseline"
  tensorboard: true
  save_video: false  # Headless, no video

# Random seed
seed: 42

# Curriculum learning
curriculum:
  enabled: true
  stages:
    - speed: 0.05
      sig_pos: 0.15
      advance_threshold: 0.08  # 80mm
      max_steps: 200000
    - speed: 0.10
      sig_pos: 0.10
      advance_threshold: 0.06  # 60mm
      max_steps: 200000
    - speed: 0.15
      sig_pos: 0.05
      advance_threshold: 0.04  # 40mm
      max_steps: 200000
    - speed: 0.20
      sig_pos: 0.02
      advance_threshold: null  # Final stage
      max_steps: 400000
  consecutive_evals: 5
  warmup_after_transition: 10000
  # LR and entropy warmup at stage transitions
  # Temporarily boost both to help adapt to harder task, then decay again
  lr_warmup_multiplier: 2.0      # 2x LR boost after transition
  ent_warmup_multiplier: 2.0     # 2x entropy boost after transition
