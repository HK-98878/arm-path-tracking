# Run 41: Moderate action_scale reduction + gradual w_ori
# Changes from run 40:
#   - action_scale: 0.005 -> 0.01 (2x reduction from original, not 4x)
#     Run 40 showed 5mm was too weak - couldn't track at higher speeds
# Kept from run 40:
#   - w_ori: gradual ramp 0.3->0.5->0.7->1.0 (not jumping to 2.0)
#   - sig_ori: gradual (0.20->0.15->0.12->0.10)
#   - orientation_modes: fixed only

# Environment
env:
  model_path: "src/models/mujoco_menagerie/franka_emika_panda/panda_nohand.xml"
  dt: 0.01  # 100 Hz control
  max_episode_steps: 1000
  ee_body_name: "attachment"

# Path
path:
  type: circle
  radius: 0.15
  center: [0.32, 0.0, 0.52]
  speed: 0.1
  # Fixed orientation only - add variation after baseline is smooth
  orientation_modes: ['fixed']
  rock_amplitude: 0.175
  n_oscillations: 2

# Control
control:
  # REDUCED: 0.02 -> 0.01 (2x reduction, not 4x)
  # 10mm linear: middle ground between oscillation (20mm) and too weak (5mm)
  # 30mrad angular: slightly reduced from 50mrad
  action_scale: [0.01, 0.01, 0.01, 0.03, 0.03, 0.03]
  dls:
    k_limit: 0.5
    lambda_min: 0.0001
    lambda_max: 0.1
    manip_threshold: 0.05

# Reward
reward:
  w_pos: 1.0
  w_ori: 1.0  # Global fallback - but curriculum stages override this
  w_vel: 0.5
  w_action_rate: 0.1
  w_joint_vel: 0.001
  sig_pos: 0.15
  sig_ori: 0.15
  sig_vel: 0.15
  pos_linear_fallback_max: 0.5
  ori_linear_fallback_max: 3.14
  vel_gate_max: 0.15
  vel_reward_type: arc_length

# PPO
ppo:
  learning_rate: 0.00003
  lr_min: 0.000005
  lr_decay: linear
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  n_steps: 2048
  n_epochs: 4
  batch_size: 64
  ent_coef: 0.01
  ent_coef_min: 0.001
  ent_decay: linear
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden_sizes: [256, 256]

# CAPS
caps:
  enabled: true
  lambda_temporal: 0.5
  lambda_spatial: 0.1
  spatial_noise_std: 0.01

# Training
training:
  total_timesteps: 1000000
  eval_frequency: 10000
  save_frequency: 50000
  log_frequency: 1000
  num_eval_episodes: 5
  normalization_warmup: 10000
  bidirectional: true

# Logging
logging:
  output_dir: "outputs/circle_baseline"
  tensorboard: true
  save_video: false

seed: 42

# Curriculum - KEY CHANGES:
#   1. w_ori gradual: 0.3 -> 0.5 -> 0.7 -> 1.0 (not 2.0)
#   2. sig_ori gradual: 0.20 -> 0.15 -> 0.12 -> 0.10 (not 0.05)
#   3. All stages have explicit w_ori (no fallback to global)
#   4. Fixed orientation only
curriculum:
  enabled: true
  stages:
    # Stage 0: Slow, loose tolerances, low orientation weight
    - speed: 0.05
      sig_pos: 0.15
      sig_ori: 0.20
      w_ori: 0.3
      orientation_modes: ['fixed']
      advance_threshold: 0.08  # 80mm
      max_steps: 500000

    # Stage 1: Moderate speed, slightly tighter
    - speed: 0.10
      sig_pos: 0.10
      sig_ori: 0.15
      w_ori: 0.5
      orientation_modes: ['fixed']
      advance_threshold: 0.06  # 60mm
      max_steps: 500000

    # Stage 2: Faster, continue tightening
    - speed: 0.15
      sig_pos: 0.05
      sig_ori: 0.12
      w_ori: 0.7
      orientation_modes: ['fixed']
      advance_threshold: 0.04  # 40mm
      max_steps: 500000

    # Stage 3: Full speed, tightest (but not extreme)
    - speed: 0.20
      sig_pos: 0.02
      sig_ori: 0.10  # Not 0.05 - keep some slack
      w_ori: 1.0     # Not 2.0 - balanced with position
      orientation_modes: ['fixed']
      advance_threshold: null
      max_steps: 1000000

  consecutive_evals: 5
  warmup_after_transition: 10000
  lr_warmup_multiplier: 2.0
  ent_warmup_multiplier: 2.0
