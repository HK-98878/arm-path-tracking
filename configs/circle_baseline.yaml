# Step 1: Circle Baseline Configuration
# Position tracking only, no CAPS, no velocity matching

# Environment
env:
  model_path: "src/models/mujoco_menagerie/franka_emika_panda/panda_nohand.xml"
  dt: 0.01  # 100 Hz control
  max_episode_steps: 1000
  ee_body_name: "attachment"  # End-effector attachment point

# Path
path:
  type: circle
  radius: 0.15  # meters (reduced from 0.3)
  center: [0.4, 0.0, 0.5]  # [x, y, z] - moved to reachable workspace
  speed: 0.2  # m/s

# Control
control:
  # Design doc recommends 0.02 for linear - keeps residual ~10x feedforward (not 43x)
  action_scale: [0.02, 0.02, 0.02, 0.05, 0.05, 0.05]  # [lin_x, lin_y, lin_z, ang_x, ang_y, ang_z]
  dls:
    k_limit: 0.5
    lambda_min: 0.0001
    lambda_max: 0.1
    manip_threshold: 0.05

# Reward (Step 3: position + velocity matching)
reward:
  w_pos: 1.0
  w_ori: 0.0  # Disabled for Step 1
  w_vel: 0.0  # Disabled for A/B test - isolating position-only convergence
  w_action_rate: 0.1    # Increased 100x - was too weak to prevent jitter
  w_joint_vel: 0.001   # Increased 10x
  # sig_pos=0.15 gives strong gradient at small errors:
  #   at 50mm: 0.89, at 100mm: 0.64, at 150mm: 0.37
  sig_pos: 0.15
  sig_ori: 0.1   # Not used yet
  sig_vel: 0.15

# PPO
ppo:
  learning_rate: 0.00003  # Reduced to prevent aggressive updates causing divergence
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  n_steps: 2048
  n_epochs: 4    # Reduced from 10 - fewer passes over same data
  batch_size: 64
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden_sizes: [256, 256]

# CAPS - smoothness in policy loss (more principled than reward penalties)
caps:
  enabled: true
  lambda_temporal: 0.5   # Penalize action changes between timesteps (5x increase)
  lambda_spatial: 0.1    # Penalize sensitivity to observation noise (10x increase)
  spatial_noise_std: 0.01

# Training
training:
  total_timesteps: 1000000  # 1M steps
  eval_frequency: 10000     # Evaluate every 10k steps
  save_frequency: 50000     # Save checkpoint every 50k steps
  log_frequency: 1000       # Log metrics every 1k steps
  num_eval_episodes: 5      # Episodes for evaluation
  normalization_warmup: 10000  # Freeze obs/reward normalization after this many steps

# Logging
logging:
  output_dir: "outputs/circle_baseline"
  tensorboard: true
  save_video: false  # Headless, no video

# Random seed
seed: 42
