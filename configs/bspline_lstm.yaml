# LSTM policy curriculum — same 5-stage structure as bspline_curriculum.yaml (Run 73 baseline).
# Changes vs bspline_curriculum.yaml:
#   - network_type: lstm, lstm_hidden_size: 256 (separate actor and critic LSTMs)
#   - lambda_temporal: 0.0 (CAPS disabled: Run 93 showed lambda=0.1 catastrophically broke bspline jerk at 2022 m/s3)
#   - p_control_alpha: 0.05 (reverted from 0.02: Run 93 config)
#   - ee_jerk penalty: pos_quality gate removed (gate created self-sustaining bimodal attractor — oscillating reduced penalty)
#   - warmup_steps: 50 — RL action zeroed for first 50 steps; LSTM h builds from clean P-control trajectory before taking over
#   - hidden_sizes retained for reference but unused when network_type=lstm

# Environment
env:
  model_path: "src/models/mujoco_menagerie/franka_emika_panda/panda_nohand.xml"
  dt: 0.01  # 100 Hz control
  max_episode_steps: 1000
  ee_body_name: "attachment"
  lookahead_n: 8
  lookahead_ds: 0.04
  randomize_start_position: true
  start_position_noise: 0.06
  include_ee_accel: false
  p_control_alpha: 0.05
  warmup_steps: 50

# Path (base config; curriculum stages override speed and path_types)
path:
  type: circle
  radius: 0.15
  center: [0.32, 0.0, 0.52]
  speed: 0.1
  orientation_modes: ['fixed']
  rock_amplitude: 0.175
  n_oscillations: 2

# B-spline path generation parameters
bspline_path:
  closed: false
  workspace_radius: 0.17
  n_control_points: 7
  n_arc_samples: 1000
  workspace_violation_prob: 0.15
  violation_magnitude: 0.04

# Control
control:
  action_scale: [0.01, 0.01, 0.01, 0.03, 0.03, 0.03]
  dls:
    k_limit: 0.5
    lambda_min: 0.0001
    lambda_max: 0.1
    manip_threshold: 0.05
    separate_lin_ang_damping: true
    manip_threshold_linear: 0.025
    manip_threshold_angular: 3.0

# Reward
reward:
  w_pos: 1.0
  w_ori: 1.0
  w_vel: 0.5
  w_action_rate: 0.05
  w_joint_vel: 0.001
  w_ee_jerk: 0.30
  ee_jerk_scale: 50.0
  ee_jerk_clip: 50.0
  w_vel_match: 0.0
  sig_pos: 0.15
  sig_ori: 0.50
  sig_vel: 0.15
  pos_linear_fallback_max: 0.5
  ori_linear_fallback_max: 3.14
  vel_gate_max: 0.15
  vel_reward_type: arc_length
  vel_match_gate_max: 0.05

# PPO
ppo:
  learning_rate: 0.00003
  lr_min: 0.000005
  lr_decay: linear
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  n_steps: 2048
  n_epochs: 4
  batch_size: 64
  ent_coef: 0.01
  ent_coef_min: 0.001
  ent_decay: linear
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden_sizes: [256, 256, 256]  # unused; kept for config compatibility
  network_type: lstm
  lstm_hidden_size: 256
  seq_len: 16
  target_kl: 0.01

# CAPS: temporal disabled (breaks bspline corner corrections), spatial retained
caps:
  enabled: true
  lambda_temporal: 0.0
  lambda_spatial: 0.1
  spatial_noise_std: 0.01

# Training
training:
  total_timesteps: 3000000
  eval_frequency: 10000
  save_frequency: 50000
  log_frequency: 1000
  num_eval_episodes: 5
  normalization_warmup: 10000
  bidirectional: true

# Logging
logging:
  output_dir: "outputs/bspline_curriculum"
  tensorboard: true
  save_video: false

seed: 42

# Curriculum: 6-stage structure matching Run 97 (best result). Changes vs Run 97:
# - Run 104: stage 1 min_steps_in_stage 100k → 200k (give fig-8 more consolidation before bspline).
# - Run 105: seq_len 16 → 32 (double LSTM temporal context; hypothesis: 160ms too short for bspline corners).
#            Final stage reverted to Run 97 baseline: sig_pos=0.015, Gaussian reward.
#            Exponential reward deferred — weaker gradient in 10-20mm operating range; revisit if seq_len
#            gets policy reliably below 7mm.
# - Run 106: grad_accumulation_steps=2 (seq_len=32 gives only 2 seqs/batch; accumulate 2 → 4 effective seqs
#            per optimizer step, matching seq_len=16 quality without changing PPO update frequency).
#            Result: bspline peaked 12.7mm in stage 2 then degraded to 21mm; jerk 4.2 m/s³ RMS (vs 0.7/0.8
#            for Run 97 peak/final). Undershoot throughout bspline — LSTM learns miscalibrated corner
#            pre-corrections on variable geometry. Conclusion: seq_len=32 actively hurts bspline generalisation.
# - Run 107: seq_len reverted to 16. Two curriculum changes targeting corner undershoot:
#            (1) min_curvature_radius tightened earlier: stages 2-4 now 0.09/0.07/0.07 (was 0.12/0.09/0.09)
#            (2) bspline path weight increased in stages 2-4: 30%/45%/50% (was 15%/30%/35%)
curriculum:
  enabled: true
  stages:
    - speed: 0.05
      sig_pos: 0.05
      sig_ori: 0.50
      w_ori: 0.3
      orientation_modes: ['fixed']
      path_types: ['circle']
      path_weights: [1.0]
      obs_noise_pos_std: 0.0
      obs_noise_vel_std: 0.0
      lookahead_noise_std: 0.0
      advance_threshold: 0.015
      max_steps: 300000
      min_steps_in_stage: 30000

    - speed: 0.10
      sig_pos: 0.04
      sig_ori: 0.25
      w_ori: 0.5
      orientation_modes: ['fixed']
      path_types: ['circle', 'figure8']
      path_weights: [0.7, 0.3]
      obs_noise_pos_std: 0.0
      obs_noise_vel_std: 0.0
      lookahead_noise_std: 0.0
      advance_threshold: 0.018
      max_steps: 400000
      min_steps_in_stage: 200000

    - speed: 0.10
      sig_pos: 0.04
      sig_ori: 0.25
      w_ori: 0.6
      orientation_modes: ['fixed']
      path_types: ['circle', 'figure8', 'bspline']
      path_weights: [0.45, 0.25, 0.30]
      obs_noise_pos_std: 0.0
      obs_noise_vel_std: 0.0
      lookahead_noise_std: 0.0
      min_curvature_radius: 0.09
      advance_threshold: 0.020
      max_steps: null
      min_steps_in_stage: 100000

    - speed: 0.15
      sig_pos: 0.030
      sig_ori: 0.20
      w_ori: 0.8
      orientation_modes: ['fixed']
      path_types: ['circle', 'figure8', 'bspline']
      path_weights: [0.35, 0.20, 0.45]
      obs_noise_pos_std: 0.0
      obs_noise_vel_std: 0.0
      lookahead_noise_std: 0.0
      min_curvature_radius: 0.07
      advance_threshold: 0.06
      max_steps: null
      min_steps_in_stage: 100000

    - speed: 0.15
      sig_pos: 0.020
      sig_ori: 0.16
      w_ori: 0.9
      orientation_modes: ['fixed']
      path_types: ['circle', 'figure8', 'bspline']
      path_weights: [0.30, 0.20, 0.50]
      obs_noise_pos_std: 0.0
      obs_noise_vel_std: 0.0
      lookahead_noise_std: 0.0
      min_curvature_radius: 0.07
      advance_threshold: 0.04
      max_steps: null
      min_steps_in_stage: 100000

    - speed: 0.20
      sig_pos: 0.015
      sig_ori: 0.12
      w_ori: 1.0
      orientation_modes: ['fixed']
      path_types: ['circle', 'figure8', 'bspline']
      path_weights: [0.25, 0.25, 0.50]
      obs_noise_pos_std: 0.003
      obs_noise_vel_std: 0.005
      lookahead_noise_std: 0.004
      min_curvature_radius: 0.07
      advance_threshold: null
      max_steps: 2000000

  consecutive_evals: 3
  warmup_after_transition: 10000
  lr_warmup_multiplier: 2.0
  ent_warmup_multiplier: 2.0
