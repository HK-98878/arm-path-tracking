# LSTM policy curriculum — same 5-stage structure as bspline_curriculum.yaml (Run 73 baseline).
# Changes vs bspline_curriculum.yaml:
#   - network_type: lstm, lstm_hidden_size: 256 (separate actor and critic LSTMs)
#   - lambda_temporal: 0.0 (CAPS disabled: Run 93 showed lambda=0.1 catastrophically broke bspline jerk at 2022 m/s3)
#   - p_control_alpha: 0.05 (reverted from 0.02: Run 93 config)
#   - ee_jerk penalty: pos_quality gate removed (gate created self-sustaining bimodal attractor — oscillating reduced penalty)
#   - warmup_steps: 50 — RL action zeroed for first 50 steps; LSTM h builds from clean P-control trajectory before taking over
#   - hidden_sizes retained for reference but unused when network_type=lstm

# Environment
env:
  model_path: "src/models/mujoco_menagerie/franka_emika_panda/panda_nohand.xml"
  dt: 0.01  # 100 Hz control
  max_episode_steps: 1000
  ee_body_name: "attachment"
  lookahead_n: 8
  lookahead_ds: 0.04
  randomize_start_position: true
  start_position_noise: 0.06
  include_ee_accel: false
  include_binormal_err: true
  p_control_alpha: 0.05
  p_ori_alpha: 0.0
  warmup_steps: 50

# Path (base config; curriculum stages override speed and path_types)
path:
  type: circle
  radius: 0.15
  center: [0.32, 0.0, 0.52]
  speed: 0.1
  orientation_modes: ['fixed']
  rock_amplitude: 0.175
  n_oscillations: 2

# B-spline path generation parameters
bspline_path:
  closed: false
  workspace_radius: 0.17
  n_control_points: 7
  n_arc_samples: 1000
  workspace_violation_prob: 0.15
  violation_magnitude: 0.04

# Control
control:
  action_scale: [0.01, 0.01, 0.01, 0.03, 0.03, 0.03]
  dls:
    k_limit: 0.5
    lambda_min: 0.0001
    lambda_max: 0.1
    manip_threshold: 0.05
    separate_lin_ang_damping: true
    manip_threshold_linear: 0.025
    manip_threshold_angular: 3.0

# Reward
reward:
  w_pos: 1.0
  w_ori: 1.0
  w_vel: 0.5
  w_action_rate: 0.05
  w_joint_vel: 0.001
  w_ee_jerk: 0.30
  ee_jerk_scale: 11000.0
  ee_jerk_clip: 5000.0
  w_ee_accel: 0.05
  ee_accel_scale: 50.0
  w_vel_match: 0.0
  sig_pos: 0.15
  sig_ori: 0.50
  sig_vel: 0.15
  pos_linear_fallback_max: 0.5
  ori_linear_fallback_max: 3.14
  vel_gate_max: 0.15
  vel_reward_type: arc_length
  vel_match_gate_max: 0.05

# PPO
ppo:
  learning_rate: 0.00003
  lr_min: 0.000005
  lr_decay: linear
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  n_steps: 2048
  n_epochs: 4
  batch_size: 64
  ent_coef: 0.01
  ent_coef_min: 0.001
  ent_decay: linear
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden_sizes: [256, 256, 256]  # unused; kept for config compatibility
  network_type: lstm
  lstm_hidden_size: 256
  seq_len: 16
  target_kl: 0.01

# CAPS: temporal disabled (breaks bspline corner corrections), spatial retained
caps:
  enabled: true
  lambda_temporal: 0.0
  lambda_spatial: 0.1
  spatial_noise_std: 0.01

# Training
training:
  total_timesteps: 5000000
  eval_frequency: 10000
  save_frequency: 50000
  log_frequency: 1000
  num_eval_episodes: 5
  normalization_warmup: 10000
  bidirectional: true

# Logging
logging:
  output_dir: "outputs/bspline_curriculum"
  tensorboard: true
  save_video: false

seed: 7

# Curriculum: 6-stage structure matching Run 97 (best result). Changes vs Run 97:
# - Run 104: stage 1 min_steps_in_stage 100k → 200k (give fig-8 more consolidation before bspline).
# - Run 105: seq_len 16 → 32 (double LSTM temporal context; hypothesis: 160ms too short for bspline corners).
#            Final stage reverted to Run 97 baseline: sig_pos=0.015, Gaussian reward.
#            Exponential reward deferred — weaker gradient in 10-20mm operating range; revisit if seq_len
#            gets policy reliably below 7mm.
# - Run 106: grad_accumulation_steps=2 (seq_len=32 gives only 2 seqs/batch; accumulate 2 → 4 effective seqs
#            per optimizer step, matching seq_len=16 quality without changing PPO update frequency).
#            Result: bspline peaked 12.7mm in stage 2 then degraded to 21mm; jerk 4.2 m/s³ RMS (vs 0.7/0.8
#            for Run 97 peak/final). Undershoot throughout bspline — LSTM learns miscalibrated corner
#            pre-corrections on variable geometry. Conclusion: seq_len=32 actively hurts bspline generalisation.
# - Run 107: seq_len reverted to 16. Two curriculum changes targeting corner undershoot:
#            (1) min_curvature_radius tightened earlier: stages 2-4 now 0.09/0.07/0.07 (was 0.12/0.09/0.09)
#            (2) bspline path weight increased in stages 2-4: 30%/45%/50% (was 15%/30%/35%)
#            Result: worse across all paths (circle 6.9mm, bspline 14.1mm best). More bspline earlier
#            disrupts circle/fig-8 foundation. Bspline mastery in Run 97 happened in stage 5, not earlier.
# - Run 108: curriculum reverted to Run 97 exactly. Single structural change: lstm_hidden_size 256→384.
#            Hypothesis: bspline generalisation limited by representational capacity for variable geometry.
#            Result: worse position than Run 97, worse log jerk. Capacity not the bottleneck.
# - Run 109: lstm_hidden_size reverted to 256. Graduated obs noise introduced from stage 1 onward
#            (1/3 → 2/3 → full across stages 1–4, full from stage 4 onward) rather than cold-start
#            noise in stage 5 only. Hypothesis: policy never learned noise-robust representations
#            because noise only appeared as a cold-start perturbation in the final stage. Clean/noisy
#            jerk gap was ~15–20x in both Run 97 and 108, unchanged by capacity increase.
#            Result: worse than Run 97 (circle 6.1mm, fig-8 7.3mm, bspline 10.5mm). Noise at stage 1
#            compounded difficulty with fig-8 introduction; circle representations never fully formed.
#            KL=0.0368 at 3M (vs Run 97 ~0.003) — noisy obs driving gradient instability in final stage.
#            Flat plateau for last 300k steps; circle spike to 54.3mm at 2.98M.
# - Run 110: noise start delayed to stage 2 (bspline introduction). Stages 0–1 clean, so circle/fig-8
#            build representations undisturbed as in Run 97. Graduated noise from 2/3 → full across
#            stages 2–4, full in stage 5. Noise magnitudes unchanged from Run 109.
# Run 121 -> 122: ee_jerk_clip raised 50 → 100. Result: failed. clip=100 quadrupled the max
# jerk penalty (15→60), suppressing bspline corner exploration in stage 2 — bspline stuck at
# 30-37mm for the entire 800k steps of stage 2 (vs 4.8mm best in R121). Noise-sensitivity
# failure emerged at 1.6M (fig-8 noisy jerk 368 m/s³ at 40× amplification vs 2× at 1.3M).
# Run 122 -> 123: revert ee_jerk_clip 50. Add intermediate stage 5 (speed=0.15, sig_pos=0.015)
# to decouple tolerance tightening from speed ramp. R121 jerk spiral began when both changed
# simultaneously; this ensures the policy adapts to tight sig_pos before the speed increase.
# Run 123 -> 124: revert to pure upright (fixed orientation throughout all stages). Orientation
# curriculum (R121-123) produced persistent fig-8 noise-sensitivity (239 m/s³ noisy jerk vs
# ~20 m/s³ for R115) with jerk collapse already present at 1.4M (stage 5), not recoverable.
# Position results with orientation (R123 best: 3.2/5.0mm fig-8/bspline) were better than R115
# but deployment jerk is unacceptable. R124 keeps the refined 7-stage curriculum structure and
# p_ori_alpha=0.05 as an angular stabiliser; all orientation_modes fixed, w_ori=0.3 throughout.
# Run 125 -> 126: p_ori_alpha 0.05 → 0.0. Checkpoint analysis (1.2M/2.2M/5M) showed the
# attractor is not present at 1.2M (all paths clean: noisy jerk 17-20 m/s³, 2× amplification),
# forms on circle during stage 5 (1.2M→2.2M, speed=0.15, sig_pos=0.015), then spreads to
# fig-8 and bspline in stage 6. p_ori_alpha injects angular disturbances that compound under
# observation noise — w_ori=0.8 delayed the onset vs R124 (w_ori=0.3) but didn't prevent it.
# With Bug 1 fixed (obs[3:6] now correct world-frame error), w_ori=0.8 alone provides a clean
# learning signal for wrist stabilisation without a P-control baseline. 7-stage curriculum and
# w_ori=0.8 unchanged — this is the meaningful difference from R115 (w_ori=0.3, no 7-stage).
#
# Run 126 -> 127: Two fixes from R126 post-mortem.
# (1) w_ori 0.8 → 0.3 (stages 3–6). R126 confirmed p_ori_alpha was not the primary jerk
#     culprit: removing it did not prevent the stage-5/6 noise-amplification jerk spiral.
#     Fig-8 jerk spikes appeared at 950k (stage 5) without p_ori_alpha, same pattern as R121-R125.
#     R115 (w_ori=0.3, no p_ori_alpha, fixed orientation) was clean at ~21 m/s³ — the only
#     remaining structural difference is w_ori=0.8. With p_ori_alpha=0 and fixed orientation
#     there is no justification for w_ori=0.8; the rationale (coordinating with p_ori_alpha
#     corrections) is gone. Reverted to match R115.
# (2) Stage 2 advance_threshold 0.025 → 0.012, min_steps 100k → 300k. In R126, stage 2's
#     advance_threshold (max across paths) was met from the very first bspline eval (bspline
#     debuted at 16.5mm < 25mm due to transfer from circle/fig-8). All of stages 2/3/4 hit
#     their 100k min_steps floors, giving bspline only 300k steps total before sig_pos=0.015.
#     By stage 5, bspline was stuck at 20mm with no improvement for 1M steps. Tighter threshold
#     (12mm) forces bspline to genuinely learn before advancing; 300k min_steps as a floor.
#
# Run 127 -> 128: Remove intermediate stage 5 (speed=0.15, sig_pos=0.015), reverting to
# 6-stage curriculum matching R115's structure. R127 analysis showed residual tracking error
# is purely lateral and on the OUTSIDE of corners (EE runs wide, not inside/chord-cutting).
# Mechanism: path turns, reference velocity points into the corner, but the jerk penalty
# prevents fast enough velocity direction change — EE overshoots the corner outward, then
# has to overcorrect back. On circles: consistent outer lateral error. On variable-curvature
# paths: oscillation between close and wide at each curve.
# At speed=0.15 (intermediate stage), corners need less centripetal acceleration so the jerk
# penalty bites less and the policy develops a lazy turn-in strategy. At speed=0.20 the same
# corners demand faster velocity redirection, but the lazy strategy persists. R115 (6-stage)
# had to develop a 0.20-speed-appropriate corner strategy from the start, producing tighter
# tracking and lower jerk. The intermediate stage was added to guard against the R121 jerk
# spiral (which occurred when both sig_pos and speed jumped together), but that spiral was an
# orientation-training artifact (w_ori=0.8 + clip=50 ceiling interaction). With p_ori_alpha=0
# and w_ori=0.3, the guard is no longer needed.
#
# Run 128 -> 129: Path-tangent-frame lookahead. Lookahead points in observation.py changed
# from EE frame (R_ew @ displacement) to path-tangent frame (R_pt @ displacement), where
# R_pt is built from path.tangent(s_current) with the standard right-hand frame
# (forward=tangent, lateral=cross(up,tangent), normal=cross(tangent,lateral)).
# A right-hand turn now always has positive lateral offset in lookahead slots regardless of
# arm pose, allowing the LSTM to anticipate velocity redirection without disentangling EE
# orientation from path geometry. Position error and velocities remain in EE frame
# (corrective loop operates there; no action-frame mismatch introduced).
# Curvature vectors (curvature_n=0, unused) already used path-tangent frame; R_pt
# construction is now shared. Observation dimension unchanged.
#
# Run 124 -> 125: R124 failed — bspline jerk attractor formed at stage 4 (sig_pos=0.020)
# immediately (jerk_l80 127→615 m/s³ within 30k steps). Root cause: p_ori_alpha + observation
# noise creates a physical feedback loop (noisy position observations → policy overcorrects →
# wrist drifts → p_ori_alpha injects angular corrections → more position disturbance). R115
# had the same noise schedule without p_ori_alpha and worked. R121 had p_ori_alpha + w_ori=0.8
# in stage 4 (full orientation variation) and stage 4 worked — jerk spiral came later in stage 5.
# Fix: w_ori raised to 0.8 from stage 3 onward (matching R121's stage 4 value). With active
# orientation reward on the fixed target, the LSTM learns to coordinate angular actions with
# p_ori_alpha's corrections rather than treating them as disturbance. Orientation error
# observation (obs[3:6]) is not noised, so the learning signal is clean throughout. Fixed-only
# modes are retained — corrections needed are small (stabilising ~10-15° natural wrist drift)
# and pose no risk of R120's position-regression failure (which came from rock/random_fixed
# modes during bspline introduction, not fixed).
# Run 120 -> 121: reverted to 6-stage curriculum (from Run 119's 7-stage).
#
# Run 120 post-mortem: orientation tracking worked well (1-4° final errors) confirming the
# two bug fixes + p_ori_alpha=0.05 are sufficient. But two regressions:
#
# 1. Bspline position stuck at 23-32mm for the entire 2M steps of stage 3. Stage 3 had
#    advance_threshold=0.020 with max_steps=null. Bspline was introduced simultaneously with
#    3:1:1:1 orientation mixing — the combined load (random geometry + orientation competition
#    + angular P-control corrections) created a high-jerk attractor that froze position.
#    Stage only advanced via max_steps fallback at 2.5M, leaving only 2.5M for recovery.
#    Final bspline position: 19.7mm (vs 5.3mm in Run 115).
#
# 2. Circle jerk attractor formed at ~2.25M (still stage 3): 0.1 → 842 → 3331 m/s³ in two
#    evals. Oscillated 300-3300 m/s³ through stage 6. jerk_l80 > jerk_full (745 vs 675 m/s³
#    at 5M) confirms it was throughout the episode, not just startup.
#
# Root cause: the 7-stage bootstrap stage (circle-only, orientation introduced early) was
# designed to solve an exploration/discovery problem that was actually caused by the two
# orientation bugs. With bugs fixed, orientation is discovered without isolation. The bootstrap
# stage's side effect — orientation variation introduced during bspline entry (stage 3) — was
# the real problem, not the solution.
#
# Fix: 6-stage structure with fixed orientation through stages 0-2, then position consolidation
# at speed=0.15 with fixed orientation (stage 3), then orientation introduced at stage 4 at
# the same speed (no simultaneous speed+orientation ramp), then full-speed final stage.
# This matches the Run 117/118 curriculum structure that gave good position results (Run 117:
# circle 4.35mm, fig-8 5.39mm, bspline 6.93mm best). With the bugs now fixed and p_ori_alpha
# in place, orientation should track well without the isolation bootstrap stage.
curriculum:
  enabled: true
  stages:
    # Stage 0: circle only, fixed orientation, slow speed — position foundation
    - speed: 0.05
      sig_pos: 0.05
      sig_ori: 0.50
      w_ori: 0.3
      orientation_modes: ['fixed']
      path_types: ['circle']
      path_weights: [1.0]
      obs_noise_pos_std: 0.0
      obs_noise_vel_std: 0.0
      lookahead_noise_std: 0.0
      advance_threshold: 0.015
      max_steps: 150000
      min_steps_in_stage: 30000

    # Stage 1: add fig-8, fixed orientation — multi-path position foundation
    - speed: 0.10
      sig_pos: 0.04
      sig_ori: 0.25
      w_ori: 0.3
      orientation_modes: ['fixed']
      path_types: ['circle', 'figure8']
      path_weights: [0.7, 0.3]
      obs_noise_pos_std: 0.0
      obs_noise_vel_std: 0.0
      lookahead_noise_std: 0.0
      advance_threshold: 0.015
      max_steps: 400000
      min_steps_in_stage: 200000

    # Stage 2: bspline introduced, fixed orientation — position-first on all paths, no
    # orientation competition. max_steps safety net prevents 2M-step stall (Run 120 lesson).
    # R126 lesson: advance_threshold 0.025 was met immediately (bspline at 16mm < 25mm on first
    # eval) because circle+fig-8's 85% weight dominates the max. min_steps floor was the only
    # gate, so bspline got 100k steps before advancing. Tightened to 0.012 so bspline must
    # genuinely improve from ~16mm → 12mm before stage 3. min_steps raised to 300k as a floor.
    - speed: 0.10
      sig_pos: 0.04
      sig_ori: 0.20
      w_ori: 0.3
      orientation_modes: ['fixed']
      path_types: ['circle', 'figure8', 'bspline']
      path_weights: [0.55, 0.30, 0.15]
      obs_noise_pos_std: 0.002
      obs_noise_vel_std: 0.003
      lookahead_noise_std: 0.002
      min_curvature_radius: 0.12
      advance_threshold: 0.012
      max_steps: 800000
      min_steps_in_stage: 300000

    # Stage 3: speed ramp to 0.15, fixed orientation.
    # R126 lesson: w_ori=0.8 was retained from R125 to "coordinate with p_ori_alpha" but
    # p_ori_alpha=0 so that rationale is gone. w_ori=0.8 with obs noise drives the same
    # noise-amplification jerk spiral as R121-R125 starting in stage 5. Reverted to 0.3.
    - speed: 0.15
      sig_pos: 0.030
      sig_ori: 0.16
      w_ori: 0.3
      orientation_modes: ['fixed']
      path_types: ['circle', 'figure8', 'bspline']
      path_weights: [0.45, 0.25, 0.30]
      obs_noise_pos_std: 0.002
      obs_noise_vel_std: 0.004
      lookahead_noise_std: 0.003
      min_curvature_radius: 0.09
      advance_threshold: 0.040
      max_steps: 800000
      min_steps_in_stage: 100000

    # Stage 4: tighten sig_pos at speed=0.15.
    - speed: 0.15
      sig_pos: 0.020
      sig_ori: 0.16
      w_ori: 0.3
      orientation_modes: ['fixed']
      path_types: ['circle', 'figure8', 'bspline']
      path_weights: [0.40, 0.25, 0.35]
      obs_noise_pos_std: 0.002
      obs_noise_vel_std: 0.004
      lookahead_noise_std: 0.003
      min_curvature_radius: 0.09
      advance_threshold: 0.050
      max_steps: null
      min_steps_in_stage: 100000

    # Stage 5: full speed + tight sig_pos simultaneously.
    # Two-slope true jerk penalty + accel² hybrid:
    #   True jerk (Δa/dt)²: free corner authority; penalises only acceleration changes.
    #   Accel² (clip=150): catches sustained corrective bursts that true jerk misses,
    #     specifically the fig-8 crossing-point noise-induced sustained accelerations.
    # Safety checks (max penalty vs r_pos at operating point ~0.90):
    #   True jerk:  0.30*5000/11000 + 0.45*15000/11000 = 0.136 + 0.614 = 0.75
    #   Accel²:     0.05*150/50 = 0.15
    #   Combined:   0.75 + 0.15 = 0.90 — right at boundary; monitor for zero-action attractor.
    # ee_jerk_clip/clip2 in m²/s⁶ (~70 m/s³ / ~141 m/s³). ee_accel_clip in m²/s⁴ (~12 m/s²).
    - speed: 0.20
      sig_pos: 0.015
      sig_ori: 0.12
      w_ori: 0.3
      orientation_modes: ['fixed']
      path_types: ['circle', 'figure8', 'bspline']
      path_weights: [0.25, 0.25, 0.50]
      obs_noise_pos_std: 0.003
      obs_noise_vel_std: 0.005
      lookahead_noise_std: 0.004
      min_curvature_radius: 0.07
      advance_threshold: null
      max_steps: 2500000
      ee_jerk_clip2: 20000
      w_ee_jerk_excess: 0.45
      ee_accel_clip: 150
      p_control_noisy_feedforward: true

  consecutive_evals: 3
  warmup_after_transition: 40000
  lr_warmup_multiplier: 2.0
  ent_warmup_multiplier: 3.0
